function drawFace(){
 // A separate face sprite preserves legibility at high pixel densities.
 ctx.fillStyle=gradient(-168,345,['#c6c3bc','#e6e3dc','#bcb9b4','#dedad4']);ctx.fill(upper);ctx.fill(lower);
 round(-32,-120,64,86,4,'#83847a','#eeebe5');round(-29,-116,58,78,1,'#a1aa98','#535b50');
 label('▴ ▮▮▮                 ▰',0,-108,5.5);
 label('OSS O501i',0,-94,10,'#283529',true);label('4/1 (火)',0,-84,7);label('9:00',0,-71,13,'#283529',true);
 ctx.fillStyle='#62705e';ctx.fill(new Path2D('M -25 -51 L -14 -55 L -2 -68 L 3 -64 L 7 -62 L 17 -54 L 26 -51 Z'));
 ctx.fillStyle='#c2c9b4';ctx.fill(new Path2D('M -8 -62 L -2 -68 L 4 -63 L 1 -64 L 0 -62 L -3 -64 Z'));
 round(-28,-49,56,.65,0,'#445540');label('✉ メール      メニュー',0,-42,5);
 for(let i=0;i<7;i++){const a=i*Math.PI/3;const x=i===6?0:Math.cos(a)*4,y=i===6?-141:-141+Math.sin(a)*3;round(x-1,y-1,2,1.7,.8,'#71736a')}
 const keys=[['⌁','▲','クリア'],['◀','●','▶'],['✉','▼','▦'],['☎','メモ','☎'],['1','2','3'],['4','5','6'],['7','8','9'],['＊','0','＃']];
 const kana=['あ','か','さ','た','な','は','ま','や','ら','','わ',''];
 keys.forEach((row,r)=>row.forEach((s,c)=>{
  const x=(c-1)*24,y=28+r*14.7;
  round(x-10.8,y-5.8,21.6,11.7,5.5,gradient(y-6,12,['#fbf8ef','#c6c3bb','#a6a39e']),'#918e89');
  const color=r===3&&c!==1?(c===0?'#43826d':'#b75c4e'):'#383938';
  label(s,x-(r>=4?2:0),y+2.6,r>=4?8:6.5,color,true);
  if(r>=4)label(kana[(r-4)*3+c],x+5,y+2,3.8)
 }));
 round(-3,151,6,1.5,1,'#757772');
 if(facePhoto.naturalWidth){
  // Retain the original button legends and receiver perforations within the beveled rim.
  ctx.save();ctx.clip(lower);ctx.imageSmoothingQuality='high';
  ctx.drawImage(facePhoto,164,267,86,159,-43,5,88,168);ctx.restore();
  ctx.save();ctx.clip(upper);
  ctx.drawImage(facePhoto,166,94,81,152,-42,-164,85,163);ctx.restore()
 }
}
function drawBack(){
 ctx.fillStyle=gradient(-165,337,['#c1c0b8','#dedbd4','#b4b3ad']);ctx.fill(upper);ctx.fill(lower);
 round(-35,40,70,113,8,'#c4c3bc','#9a9b93');round(-8,46,16,2,1,'#aaaba4')
}
function drawHinge(){
 const stops=['#696b68','#c4c1b9','#fffaf0','#acaaa4','#777973'];
 for(const [x,w] of [[-42,13],[-28,8],[-19,20],[2,26],[29,13]])round(x,-9,w,21,2,gradient(-9,21,stops),'#969690')
}
let yaw=-24, spinning=false, previous=0;
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 // Oversample even on 1x displays; browser compositing downsamples the final image.
 const aa=Math.min(3,Math.max(2,window.devicePixelRatio||1));
 if(canvas.width!==Math.round(w*aa)||canvas.height!==Math.round(h*aa)){canvas.width=Math.round(w*aa);canvas.height=Math.round(h*aa)}
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
 const scale=Math.min(w/165,h/405)*aa,a=yaw*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
 const ox=canvas.width/2,oy=canvas.height/2+12*scale;
 const side=c>=0?1:-1;
 function plane(z,inset=1){
  const projected=Math.abs(c)<.012?.012*side:c;
  ctx.setTransform(scale*projected*inset,scale*.09*s*inset,0,scale*inset,ox+scale*s*z,oy-scale*.09*c*z)
 }
 // Back-to-front parallel silhouette sprites. Close spacing also fills edge-on views.
 for(let i=0;i<=96;i++){
  const t=i/96,z=side*(t*24-12),bevel=1-.035*Math.pow(Math.abs(2*t-1),5);
  plane(z,bevel);
  const seam=Math.abs(z+2)<.8;
  const shade=seam?105:Math.round(164+32*Math.cos((z-3)*.16));
  ctx.fillStyle='rgb('+shade+','+(shade-1)+','+(shade-5)+')';
  ctx.fill(upper);ctx.fill(lower);
  if(Math.abs(z+5)<6){ctx.fillStyle='#b6b6a7';ctx.fill(antenna)}
  round(-42,-8,84,20,2,'#a09f99');
 }
 plane(side*12,.965);
 if(side>0)drawFace();else drawBack();
 drawHinge();output.value=Math.round(yaw)+'°';slider.value=Math.round(yaw)
}
function setAngle(v){yaw=((v+540)%360)-180;draw()}
function stop(){spinning=false;spin.setAttribute('aria-pressed','false')}
const spin=document.querySelector('#spin');
function frame(now){if(!spinning)return;setAngle(yaw+Math.min(80,now-previous)*.025);previous=now;requestAnimationFrame(frame)}
spin.onclick=()=>{if(spinning){stop();return}spinning=true;previous=performance.now();spin.setAttribute('aria-pressed','true');requestAnimationFrame(frame)};
slider.oninput=()=>{stop();yaw=Number(slider.value);draw()};
document.querySelector('#front').onclick=()=>{stop();setAngle(0)};
document.querySelector('#back').onclick=()=>{stop();setAngle(180)};
let drag=null;
canvas.onpointerdown=e=>{stop();drag={x:e.clientX,yaw};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(drag)setAngle(drag.yaw+(e.clientX-drag.x)*.65)};
canvas.onlostpointercapture=()=>{drag=null};
new ResizeObserver(draw).observe(canvas);draw()
</script></html>
