<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSS O501i · Sprite viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#24382f;font-family:"DM Sans",system-ui,sans-serif}main{max-width:940px;margin:0 auto;padding:clamp(16px,4vw,44px)}header,footer,.tools{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}header{border-bottom:1px solid #a3ada1;padding-bottom:15px}h1{font-size:clamp(26px,4vw,44px);font-weight:550;letter-spacing:-.055em;margin:0}header span,output{font:12px monospace;letter-spacing:.08em}.stage{position:relative;background:radial-gradient(ellipse at 48% 48%,#fafaf4,#e4e7dd);margin:16px 0;border:1px solid #c6cbbf;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:clamp(360px,65vh,640px);touch-action:pan-y;cursor:grab}canvas:active{cursor:grabbing}.hint{position:absolute;bottom:12px;left:16px;font-size:11px;color:#59695c;pointer-events:none}.tools{justify-content:flex-start;margin-bottom:10px}.lcd-state{font-weight:600;color:#304c3a}button{background:#fafaf6;border:1px solid #adb7a9;color:inherit;border-radius:7px;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#2e4937;color:white}label{font-size:13px;display:flex;gap:10px;align-items:center}input{accent-color:#36583e;width:clamp(100px,22vw,220px)}details{margin:12px 0}summary{cursor:pointer}#lcdZoom{width:174px;max-width:100%;height:auto;image-rendering:pixelated;margin:10px 0}.tools input[type=checkbox]{width:auto}footer{font-size:12px;color:#556257;margin-top:16px}output{min-width:5ch}

<main><header><h1>OSS O501i</h1><span>SPRITE STACK VIEWER</span></header>
<div class="stage"><canvas aria-label="銀色の折りたたみ携帯電話 OSS O501i。下の回転角で向きを変更できます。"></canvas><span class="hint">左右ドラッグで回転 ／ 本体キーをタップ</span></div>
<div class="tools"><label>回転角 <input id="angle" type="range" min="-180" max="180" value="0"></label><output for="angle"></output><button id="front">正面</button><button id="back">背面</button><button id="spin" aria-pressed="false">自動回転</button></div>
<div class="tools"><label>開き角 <input id="fold" type="range" min="0" max="180" value="180"></label><output id="foldValue" for="fold"></output><button id="closeLid">閉じる</button><button id="openLid">開く</button></div>
<div class="tools" aria-label="携帯の操作"><button data-key="mail">メール</button><button data-key="menu">メニュー</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="ok">決定</button><button data-key="clear">戻る</button></div><div class="tools"><button id="ring">着信させる</button><button data-key="call">応答／発信</button><button data-key="end">終話</button><label><input type="checkbox" id="sound" checked>音を鳴らす</label></div><details><summary>液晶を拡大</summary><canvas id="lcdZoom" width="116" height="146" aria-label="本体と同じ液晶画面"></canvas></details><span class="lcd-state" role="status"></span><footer>数字・矢印・Enter・Esc キーでも操作できます。メールと発着信は端末内のデモです。背面と側面は正面画像から推定した形状です。</footer></main>

// Model coordinates follow the reference image, with the hinge at (206,257).
function photoRegion(x,y,w,h){
 if(facePhoto.naturalWidth)ctx.drawImage(facePhoto,x+206,y+257,w,h,x,y,w,h)
}
function drawFace(isLid){
 ctx.fillStyle='#c2beb7';ctx.fill(isLid?upper:lower);
 if(isLid)photoRegion(-44,-165,89,158);
 else photoRegion(-45,9,92,165)
}
function drawBack(isLid){
 const shape=isLid?upper:lower;
 const g=ctx.createLinearGradient(-42,-80,45,-65);
 for(const [t,color] of [[0,'#8d8983'],[.09,'#c6c3bd'],[.34,'#edeae3'],[.65,'#d3d0ca'],[.91,'#bdbab4'],[1,'#96938e']])g.addColorStop(t,color);
 ctx.fillStyle=g;ctx.fill(shape);
 if(isLid){
  const edge=new Path2D('M -36 -14 L -36 -140 Q -36 -154 -19 -157 Q 3 -163 24 -155 Q 36 -152 36 -139 L 36 -14');
  ctx.strokeStyle='#b1aea8';ctx.lineWidth=.65;ctx.stroke(edge)
 }else{
  round(-36,33,72,123,10,gradient(33,123,['#d0cdc7','#c4c1bb','#cfccc7']),'#93918d');
  for(let i=0;i<3;i++)round(-8,44+2.2*i,16,.8,.4,'#a29f98')
 }
}
const keyRows=[29,44,59,74,89,105,119,133];
function keyShapes(plane,depth){
 // Each cap has its own raised rim and a separately projected printed surface.
 for(const [r,y] of keyRows.entries()){
  for(let col=0;col<3;col++){
   const x=(col-1)*25+1,w=r<4?20:19,h=10;
   plane(depth+.65,1);round(x-w/2,y-h/2,w,h,4,'#aaa6a0');
   plane(depth+1.3,1);ctx.save();ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,4);ctx.clip();
   photoRegion(x-w/2,y-h/2,w,h);ctx.restore()
  }
 }
}
function drawHinge(plane){
 // Circular barrel cross sections taper toward each end of the pin.
 for(let i=-24;i<=24;i++){
  const depth=i/24*8;
  const radius=Math.sqrt(Math.max(.15,64-depth*depth));
  plane(1+depth,1);
  for(const [x,w] of [[-43,14],[-28,8],[-19,19],[1,28],[30,13]]){
   round(x,-radius,w,2*radius,Math.min(1,radius),gradient(-radius,2*radius,['#95918a','#e7e3dc','#aaa69e','#74716c']))
  }
 }
}
const screens={
 menu:{title:'メニュー',items:['メール','電話帳','着信音設定']},
 mail:{title:'受信メール',items:['ようこそ']},
 contacts:{title:'電話帳',items:['自宅','オフィス']},
 tones:{title:'着信音設定',items:['ベル 1','ベル 2','電子音']}
};
let screen='home',selection=0,tone=0,digits='',message='',returnTo='home';
let opening=180,yaw=0,spinning=false,lastTime=0,motion=null,frameId=0;
const keymap=[['mail','up','menu'],['left','ok','right'],['mail','down','menu'],['call','clear','end'],['1','2','3'],['4','5','6'],['7','8','9'],['*','0','#']];
const fold=document.querySelector('#fold'),spin=document.querySelector('#spin');
let keypadMatrix, lidBlocks=[],upperInFront=false;
function go(next){screen=next;selection=next==='tones'?tone:0}
const sound=document.querySelector('#sound');
function audioContext(){
 if(!sound.checked)return;
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(!Audio)return;
 const audio=audioContext.current||(audioContext.current=new Audio());
 audio.resume().catch(()=>{});return audio
}
function dialTone(k){
 const at='123456789*0#'.indexOf(k),audio=audioContext();
 if(!audio||at<0)return;
 const t=audio.currentTime;
 for(const hz of [[697,770,852,941][Math.floor(at/3)],[1209,1336,1477][at%3]]){
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.frequency.value=hz;gain.gain.setValueAtTime(.024,t);gain.gain.exponentialRampToValueAtTime(.001,t+.085);
  osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.09)
 }
}
function playTone(n){
 const audio=audioContext();if(!audio)return;
 [0,1,2].forEach(i=>{
  const osc=audio.createOscillator(),amp=audio.createGain(),t=audio.currentTime+i*.11;
  osc.frequency.value=[[660,880,660],[880,660,990],[1046,1046,784]][n][i];
  amp.gain.setValueAtTime(.045,t);amp.gain.exponentialRampToValueAtTime(.001,t+.09);
  osc.connect(amp);amp.connect(audio.destination);osc.start(t);osc.stop(t+.1)
 })
}
let ringTimer=0;
function silenceRing(){clearInterval(ringTimer);ringTimer=0}
window.addEventListener('pagehide',silenceRing);
document.querySelector('#ring').onclick=()=>{
 silenceRing();go('incoming');playTone(tone);ringTimer=setInterval(()=>playTone(tone),1800);draw()
};
function key(k){
 if(opening<12)return;
 if(screen==='incoming'||screen==='talking'){
  if(k==='end'||k==='clear'){silenceRing();go('home')}
  else if(screen==='incoming'&&(k==='ok'||k==='call')){silenceRing();go('talking')}
  draw();return
 }
 const list=screens[screen];
 if(k==='end'){digits='';go('home')}
 else if(k==='clear'){
  if(screen==='dial'&&digits.length>1)digits=digits.slice(0,-1);
  else if(screen==='note')go('mail');
  else if(screen==='call')go(returnTo);
  else if(['mail','contacts','tones'].includes(screen))go('menu');
  else{digits='';go('home')}
 }else if(k==='menu')go('menu');
 else if(k==='mail')go('mail');
 else if(/^[0-9*#]$/.test(k)&&(screen==='home'||screen==='dial')){
  dialTone(k);if(screen==='home')digits='';digits=(digits+k).slice(0,16);go('dial')
 }else if(list&&['up','left','down','right'].includes(k)){
  selection=(selection+(['up','left'].includes(k)?-1:1)+list.items.length)%list.items.length
 }else if(k==='ok'||k==='call'){
  if(screen==='menu')go(['mail','contacts','tones'][selection]);
  else if(screen==='mail')go('note');
  else if(screen==='tones'){tone=selection;playTone(tone)}
  else if(screen==='contacts'||(screen==='dial'&&digits)){
   returnTo=screen;message=screen==='contacts'?list.items[selection]:digits;go('call')
  }else if(screen==='home')go(k==='call'?'dial':'menu')
 }
 draw()
}
const lcdZoom=document.querySelector('#lcdZoom');

let lcdCache='';
function lcd(){
 const visible=opening>=12;
 const signature=JSON.stringify([visible,screen,selection,tone,digits,message]);
 if(signature!==lcdCache){
  const bodyContext=ctx;ctx=lcdPixels;
  try{
   ctx.setTransform(2,0,0,2,58,224);
   if(visible)paintLcd();else{ctx.fillStyle='#a9b39f';ctx.fillRect(-29,-112,58,73)}
   const pixels=ctx.getImageData(0,0,116,146),d=pixels.data;
   for(let i=0;i<d.length;i+=4){
    const dark=d[i+1]<(screen==='home'&&facePhoto.naturalWidth?105:139);
    d[i]=dark?38:169;d[i+1]=dark?55:179;d[i+2]=dark?44:159;d[i+3]=255
   }
   ctx.resetTransform();ctx.putImageData(pixels,0,0);lcdCache=signature
  }finally{ctx=bodyContext}
 }
}

  else{
   const lines=screen==='incoming'?['オフィス','応答 ／ 拒否']:screen==='talking'?['オフィス','通話デモ']:screen==='dial'?[digits.slice(0,8),digits.slice(8)]:screen==='call'?[message.slice(0,8),message.slice(8),'呼出中…']:['ようこそ！','OSS O501i から','最初のメールです。'];
   lines.forEach((v,i)=>label(v,0,-82+i*10,7,ink))
  }
 }
 round(-28,-49,56,.65,0,ink);label(screen==='home'?'✉ メール     メニュー':screen==='incoming'?'拒否         応答':screen==='talking'?'終話':'戻る         決定',0,-42,5.5,ink)
}
function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight,aa=Math.min(3,Math.max(2,window.devicePixelRatio||1));
 if(canvas.width!==Math.round(w*aa)||canvas.height!==Math.round(h*aa)){canvas.width=Math.round(w*aa);canvas.height=Math.round(h*aa)}
 ctx.resetTransform();ctx.clearRect(0,0,canvas.width,canvas.height);
 const a=yaw*Math.PI/180,c=Math.cos(a),s=Math.sin(a),f=(180-opening)*Math.PI/180;
 const scale=Math.min(w/265,h/405)*aa,ox=canvas.width/2-scale*s*75*Math.sin(f);
 const oy=canvas.height/2-scale*(172+Math.min(0,-197*Math.cos(f)))/2;
 lcd();lidBlocks=[];
 function body(isLid){
  const C=isLid?Math.cos(f):1,S=isLid?Math.sin(f):0,shape=isLid?upper:lower;
  const facing=c*C+.09*S,side=facing>=0?1:-1;
  function plane(z,inset){
   // Rotate the lid around the pin in front of the two inner faces.
   const y0=(z-9)*S,z0=9+(z-9)*C;
   // Give an edge-on slice the footprint of one layer so the side stays continuous.
   const edge=Math.abs(facing)<.012?(.012*side-facing):0;
   ctx.setTransform(scale*(c+edge*C)*inset,scale*.09*s*inset,-scale*s*S*inset,scale*(C+.09*c*S+edge*c)*inset,ox+scale*s*z0,oy+scale*(y0-.09*c*z0))
  }
  const half=isLid?5.5:7.5;
  for(let i=0;i<=96;i++){
   const t=side*(i/48-1),z=t*half,bevel=1-.018*Math.pow(Math.abs(t),3);
   plane(z,bevel);
   if(isLid&&i%4===0)lidBlocks.push(ctx.getTransform());
   const shade=Math.abs(t+.18)<.055?124:Math.round(174+28*Math.cos((t-.30)*2.7));
   ctx.fillStyle='rgb('+shade+','+(shade-1)+','+(shade-5)+')';ctx.fill(shape);
   if(isLid&&Math.abs(t+.10)<.80){
    ctx.fillStyle=gradient(-197,41,['#c8c7bb','#a4a496','#c5c3ba','#a09d94']);ctx.fill(antenna);
    if(facePhoto.naturalWidth){ctx.save();ctx.clip(antenna);photoRegion(22,-197,20,46);ctx.restore()}
   }
  }
  plane(side*half,1);ctx.save();ctx.clip(shape);
  if(side>0){drawFace(isLid);if(isLid&&screen!=='home')ctx.drawImage(lcdZoom,-28,-113,56,73)}else drawBack(isLid);
  ctx.restore();
  if(!isLid){
   if(side>0)keyShapes(plane,half);
   plane(half+1.3,1);keypadMatrix=side>0?ctx.getTransform():null;
   drawHinge((z,inset)=>plane(side*z,inset));
   if(Math.abs(c)>.15){
    plane(side*8.5,1);ctx.save();ctx.beginPath();ctx.roundRect(-43,-9,87,20,3);ctx.clip();
    if(side>0)photoRegion(-43,-9,87,20);ctx.restore()
   }
  }
 }
 upperInFront=c*Math.sin(f/2)-.09*Math.cos(f/2)>=0;
 body(!upperInFront);body(upperInFront);
 ctx.resetTransform();output.value=Math.round(yaw)+'°';slider.value=Math.round(yaw);
 fold.value=Math.round(opening);document.querySelector('#foldValue').value=Math.round(opening)+'°';
 const status=opening<12?(screen==='incoming'?'着信中・開いて応答':'閉じています'):screens[screen]?.title||({home:'待受',dial:'番号入力',call:'発信デモ',incoming:'着信中',talking:'通話中',note:'受信メール'})[screen];
 const live=document.querySelector('.lcd-state');if(live.textContent!==status)live.textContent=status;
 document.querySelectorAll('[data-key]').forEach(b=>b.disabled=opening<12)
}
function tick(now){
 frameId=0;
 if(spinning)yaw=((yaw+Math.min(64,now-lastTime)*.025+540)%360)-180;
 if(motion){
  const t=Math.min(1,(now-motion.start)/480);
  opening=motion.from+(motion.to-motion.from)*t*t*(3-2*t);
  if(t===1)motion=null
 }
 lastTime=now;draw();if(spinning||motion)schedule()
}
function schedule(){if(!frameId)frameId=requestAnimationFrame(tick)}
function moveLid(to){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){motion=null;opening=to;draw();return}
 motion={from:opening,to,start:performance.now()};schedule()
}
function stop(){spinning=false;spin.setAttribute('aria-pressed','false')}
spin.onclick=()=>{if(spinning){stop();return}spinning=true;lastTime=performance.now();spin.setAttribute('aria-pressed','true');schedule()};
slider.oninput=()=>{stop();yaw=Number(slider.value);draw()};
fold.oninput=()=>{motion=null;opening=Number(fold.value);draw()};
document.querySelector('#closeLid').onclick=()=>moveLid(0);
document.querySelector('#openLid').onclick=()=>moveLid(180);
document.querySelector('#front').onclick=()=>{stop();yaw=0;draw()};
document.querySelector('#back').onclick=()=>{stop();yaw=-180;draw()};
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));
window.addEventListener('keydown',e=>{
 if(e.target.matches('input')||e.ctrlKey||e.altKey||e.metaKey||(e.target.matches('button')&&e.key==='Enter'))return;
 const mapped=({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'clear',Backspace:'clear'})[e.key]||(/^[0-9*#]$/.test(e.key)?e.key:null);
 if(mapped){e.preventDefault();key(mapped)}
});
function tap(e){
 if(!keypadMatrix||opening<12)return;
 const rect=canvas.getBoundingClientRect(),px=(e.clientX-rect.left)*canvas.width/rect.width,py=(e.clientY-rect.top)*canvas.height/rect.height;
 function local(matrix){return new DOMPoint(px,py).matrixTransform(matrix.inverse())}
 if(upperInFront&&lidBlocks.some(m=>{const p=local(m);return ctx.isPointInPath(upper,p.x,p.y)||ctx.isPointInPath(antenna,p.x,p.y)}))return;
 const p=local(keypadMatrix),r=Math.round((p.y-29)/14.8),c=Math.round(p.x/24)+1;
 if(keymap[r]?.[c]&&Math.abs(p.x-(c-1)*24)<12&&Math.abs(p.y-(29+r*14.8))<7.4){
  const soft=r===0&&screen!=='home';key(soft&&c===0?'clear':soft&&c===2?'ok':keymap[r][c])
 }
}
let drag=null;
canvas.onpointerdown=e=>{stop();drag={x:e.clientX,y:e.clientY,yaw,moved:false};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4)drag.moved=true;if(drag.moved){yaw=((drag.yaw+(e.clientX-drag.x)*.65+540)%360+360)%360-180;draw()}};
canvas.onpointerup=e=>{if(drag&&!drag.moved)tap(e);drag=null};
canvas.onlostpointercapture=()=>{drag=null};
new ResizeObserver(draw).observe(canvas);draw()
</script></html>
